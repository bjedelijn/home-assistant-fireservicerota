name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python / JSON / YAML / Home Assistant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff PyYAML

      - name: Python syntax check
        run: python -m compileall -q custom_components

      - name: Ruff critical checks
        run: ruff check custom_components --select=E9,F63,F7,F82

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("custom_components").rglob("*.json"))
          for path in files:
              with path.open("r", encoding="utf-8") as fh:
                  json.load(fh)
              print(f"OK {path}")
          PY

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path("custom_components").rglob("*.yaml")) + list(Path("docs/examples").rglob("*.yaml"))
          for path in files:
              with path.open("r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"OK {path}")
          PY

      - name: Validate manifest requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/fireservicerota/manifest.json").read_text(encoding="utf-8"))
          requirements = manifest.get("requirements", [])
          if not requirements:
              raise SystemExit("manifest.json has no requirements")
          for requirement in requirements:
              if "==" not in requirement:
                  raise SystemExit(f"Requirement is not pinned: {requirement}")
              print(f"OK pinned requirement: {requirement}")
          PY

      - name: Install latest Home Assistant and integration requirements
        run: |
          python -m pip install homeassistant
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/fireservicerota/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          requirements = manifest.get("requirements", [])
          if requirements:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", *requirements]
              )
          PY

      - name: Home Assistant import smoke test
        run: |
          python - <<'PY'
          import importlib
          import homeassistant

          modules = (
              "custom_components.fireservicerota",
              "custom_components.fireservicerota.config_flow",
              "custom_components.fireservicerota.sensor",
              "custom_components.fireservicerota.binary_sensor",
              "custom_components.fireservicerota.switch",
          )

          print(f"Home Assistant version: {homeassistant.__version__}")
          for module in modules:
              importlib.import_module(module)
              print(f"OK imported {module}")
          PY
