send_pager_message:
  name: Send pager message
  description: Send a text message to a pager linked to the authenticated FireServiceRota / BrandweerRooster account.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional Home Assistant config entry ID. Required only when multiple FireServiceRota config entries are loaded.
      example: 0123456789abcdef0123456789abcdef
      selector:
        text:
    pager_id:
      name: Pager ID
      description: Optional pager ID. If exactly one pager is linked, it is selected automatically.
      example: 12345
      selector:
        number:
          mode: box
    message:
      name: Message
      description: Text to send to the pager.
      required: true
      example: Test message from Home Assistant
      selector:
        text:
          multiline: true
    address:
      name: Address
      description: Optional pager address/capcode. Do not use together with addresses.
      selector:
        text:
    addresses:
      name: Addresses
      description: Optional list of pager addresses/capcodes. Do not use together with address.
      selector:
        text:
          multiple: true
    confirmation:
      name: Confirmation
      description: Use the pager's own registered address when no explicit address or addresses are supplied.
      default: true
      selector:
        boolean:
    webhook_url:
      name: Webhook URL
      description: Optional callback URL for delivery status updates supported by the BrandweerRooster pager API.
      selector:
        text:
          type: url

backfill_history_staffing:
  name: Backfill history staffing
  description: Re-fetch retained closed incidents that do not yet contain normalized staffing data. This action runs only when called and does not create a periodic history refresh.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional Home Assistant config entry ID. Required only when multiple FireServiceRota config entries are loaded.
      example: 0123456789abcdef0123456789abcdef
      selector:
        text:
    incident_id:
      name: Incident ID
      description: Optional retained closed incident ID. Leave empty to check missing staffing data in recent retained history.
      example: "1234567"
      selector:
        text:
    limit:
      name: History limit
      description: Maximum number of retained history records to consider when incident_id is not supplied.
      default: 25
      selector:
        number:
          min: 1
          max: 25
          mode: box


mark_incident_closed:
  name: Mark incident closed locally
  description: Locally close one retained incident or its practical group. BrandweerRooster is not modified.
  fields:
    incident_id:
      name: Incident ID
      required: true
      selector:
        text:
    scope:
      name: Scope
      default: group
      selector:
        select:
          options: [incident, group]

reopen_incident:
  name: Reopen locally closed incident
  description: Undo a local pending close. Genuine API closures are never reopened.
  fields:
    incident_id:
      name: Incident ID
      required: true
      selector:
        text:
    scope:
      name: Scope
      default: group
      selector:
        select:
          options: [incident, group]

set_station_availability:
  name: Set station availability
  description: Create a temporary paraat/niet-paraat override for one dynamically discovered station membership.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional Home Assistant config entry ID. Required only when multiple FireServiceRota config entries are loaded.
      selector:
        text:
    membership_id:
      name: Membership ID
      description: Active station membership to update. Use this or station_id. If the account has exactly one station membership, both may be omitted.
      selector:
        number:
          mode: box
    station_id:
      name: Station ID
      description: Dynamically discovered station to update. Use this or membership_id.
      selector:
        number:
          mode: box
    available:
      name: Paraat
      description: Turn paraat on or off for the selected post during the temporary override.
      required: true
      selector:
        boolean:
    mode:
      name: Period
      description: End the override at the next agenda change for this station membership, after a fixed duration, or at a custom end time.
      required: true
      default: next_schedule_change
      selector:
        select:
          options:
            - label: Tot volgende roosterwijziging
              value: next_schedule_change
            - label: 1 uur
              value: 1h
            - label: 2 uur
              value: 2h
            - label: 4 uur
              value: 4h
            - label: 8 uur
              value: 8h
            - label: Aangepaste periode
              value: custom
    start_time:
      name: Starttijd
      description: Optional start time. When omitted, the current 15-minute block is used.
      selector:
        datetime:
    end_time:
      name: Eindtijd
      description: Required only for custom mode.
      selector:
        datetime:
    comments:
      name: Opmerking
      description: Optional comment stored with the BrandweerRooster schedule exception.
      default: Home Assistant
      selector:
        text:
    ignore_schedule_warnings:
      name: Roosterwaarschuwingen negeren
      description: Allow the write even when BrandweerRooster reports a staffing warning.
      default: true
      selector:
        boolean:


analyze_incident_fairness:
  name: Analyze incident fairness
  description: Read the JSON audit history of one BrandweerRooster incident and return automated staffing suggestions and reported turnout. This experimental read-only action does not change incident data.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional when only one FireServiceRota integration is configured.
      selector:
        text:
    incident_id:
      name: Incident ID
      required: true
      selector:
        text:
    max_pages:
      name: Maximum audit pages
      description: Limit between 1 and 20, incomplete histories are flagged.
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box
    station_staffing_modes:
      name: Confirmed automatic staffing per station (optional)
      description: "Optional station IDs mapped to enabled/disabled for this incident only. Not persisted and never sent to BrandweerRooster. Example: {'3853': disabled}. Absence of fairness suggestions is not evidence of disabled staffing."
      selector:
        object:

set_replacement_vehicle:
  name: Vervangend voertuig instellen
  description: >-
    Koppel een tijdelijk vervangend voertuig aan een specifiek origineel voertuig binnen een eigen post. Meerdere koppelingen per post zijn toegestaan.
    P2000-berichten en de Brandbase-registratie worden niet aangepast.
  fields:
    station_id:
      name: Post-ID
      required: true
      example: 123
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    original_vehicle_number:
      name: Oorspronkelijk voertuignummer
      description: Het normale voertuig van de post (bijvoorbeeld 04-2350).
      required: true
      example: "04-2350"
      selector:
        text: {}
    vehicle_number:
      name: Vervangend voertuignummer
      required: true
      example: "04-1034"
      selector:
        text: {}
    vehicle_function:
      name: Voertuigfunctie
      description: Optioneel; voor automatische BWR-voertuigcontrole is een expliciete functie vereist (bijv. TS, WTS).
      required: false
      example: "TS"
      selector:
        text: {}
    entry_id:
      name: Configuratie-ID
      required: false
      selector:
        text: {}

clear_replacement_vehicle:
  name: Vervangend voertuig opheffen
  description: Beëindig alleen de vervanging van een specifiek oorspronkelijk voertuig.
  fields:
    station_id:
      name: Post-ID
      required: true
      example: 123
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    original_vehicle_number:
      name: Oorspronkelijk voertuignummer
      description: Alleen de vervanging van dit voertuig wordt opgeheven.
      required: true
      example: "04-2350"
      selector:
        text: {}
    entry_id:
      name: Configuratie-ID
      required: false
      selector:
        text: {}

get_replacement_vehicles:
  name: Actieve vervangende voertuigen
  description: Vraag de huidige per-post vervangingskoppelingen op.
  fields:
    entry_id:
      name: Configuratie-ID
      required: false
      selector:
        text: {}

get_incident_vehicle_evidence:
  name: Inspecteer BWR-voertuigvelden (veilig)
  description: >-
    Lees de veldnamen en exacte voertuignummers uit een BrandweerRooster-incident.
    Retourneert geen persoonsgegevens of volledige incidenttekst.
    Diagnostiek is geen bewijs van daadwerkelijke inzet.
  fields:
    entry_id:
      name: Configuratie-ID
      required: false
      selector:
        text: {}
    incident_id:
      name: Incident-ID
      description: Optioneel; zonder waarde wordt het laatste ontvangen incident opgehaald.
      required: false
      selector:
        text: {}


import_fairness_history:
  name: Import historical fairness (private)
  description: >-
    On-demand import of up to five authorized incident audits into private
    Home Assistant storage. No personnel or station audit records are sent to GitHub.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    incident_ids:
      name: Incident IDs (1 to 5)
      required: true
      selector:
        text:
          multiple: true
    max_pages:
      name: Maximum audit pages
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box

preview_fairness_history:
  name: Preview historical fairness (anonymous)
  description: >-
    Read only a compact aggregated historical overview from private Home Assistant
    storage. Does not infer the actual crew or make predictions.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box

preview_fairness_advisory:
  name: Preview fairness by task (anonymous)
  description: >-
    Read-only task-specific historical observations. No individual names or
    memberships returned. Does not predict a future crew.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    task_id:
      name: Task ID
      required: true
      selector:
        number:
          min: 1
          mode: box


probe_fairness_availability:
  name: Inspect fairness availability (anonymous)
  description: >-
    Inspect at most one authorized historical candidate via a read-only schedule
    request. Returns only limited diagnostic status and no identities, schedule
    intervals or personal availability values.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    task_id:
      name: Task ID
      required: true
      selector:
        number:
          min: 1
          mode: box

probe_fairness_task_coverage:
  name: Inspect fairness task requirement coverage (aggregate)
  description: >-
    Verify the current aggregate coverage for one uniquely identified task
    requirement. Read-only and privacy-filtered; it cannot infer crew selection,
    personal qualifications or actual deployment.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    task_id:
      name: Task ID
      required: true
      selector:
        number:
          min: 1
          mode: box

inspect_fairness_revisions:
  name: Inspect fairness proposal revisions (anonymous)
  description: >-
    Read a bounded historical incident audit, compare the first and latest
    fairness proposals, count changes per role, and report the timestamps of
    modified proposal snapshots. The service returns no names or membership IDs,
    cannot explain why somebody was selected, and
    never modifies BWR, HA storage, rosters, or alarms.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    incident_id:
      name: Incident ID
      required: true
      selector:
        text: {}
    max_pages:
      name: Maximum audit pages
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box

inspect_turnout_audit:
  name: Inspect retrospective turnout audit markers (anonymous)
  description: >-
    Read one authorized incident audit on demand and return only the times and
    count of observed 'Werkelijke opkomststatus' change markers. Does not reveal
    people, audit descriptions or actor details and does not establish that a
    manual correction or real vehicle turnout took place.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    incident_id:
      name: Incident ID
      required: true
      selector:
        text: {}
    max_pages:
      name: Maximum audit pages
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box

refresh_turnout_audit_history:
  name: Review historical turnout status records (bounded)
  description: >-
    Read-only BWR review of at most two already-cached incidents per invocation.
    Recent incidents are revisited daily and older ones weekly for up to 45 days.
    Only anonymous counts and last-seen audit timestamps are saved privately
    in Home Assistant. No automatic scheduling until you create a HA automation.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box

probe_historical_incident_list:
  name: Probe BWR historical incident listing (read-only)
  description: >-
    Read at most five authorized incident-list pages, requesting 25 records
    per page (maximum 125 records). Return anonymous per-page date coverage,
    item counts and overlap counts only. No incident IDs, people or post details.
    Use start_page to examine older ranges without reloading page one.
    Does not prove complete historical archive coverage.
  fields:
    station_id:
      name: Authorized station ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    start_page:
      name: Starting page
      description: First 25-record listing page to inspect.
      default: 1
      selector:
        number:
          min: 1
          max: 500
          mode: box
    max_pages:
      name: Number of pages
      description: At most five consecutive listing pages.
      default: 5
      selector:
        number:
          min: 1
          max: 5
          mode: box

get_dispatch_archive_status:
  name: Get dispatch archive status
  description: >-
    Show incident archive counts and active retention settings. No incident
    identifiers, titles, vehicle data or personal information are returned.
    The historical import is not yet connected.
  fields:
    entry_id:
      name: Integration entry ID (optional)
      required: false
      selector:
        text:
