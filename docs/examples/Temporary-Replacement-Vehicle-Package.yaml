# Example Home Assistant package for the native replacement vehicle services.
# Replace station_id with a discovered station ID for your own membership.
# NOTE: a temporary replacement is a local operational attribution.
# It does not alter official dispatch, original P2000 texts, or Brandbase.

script:
  brandweer_post_a_vervangend_voertuig_instellen:
    alias: Brandweer Post A - Vervangend voertuig instellen
    icon: mdi:fire-truck
    mode: single
    fields:
      voertuignummer:
        required: true
        selector:
          text: {}
    sequence:
      - action: fireservicerota.set_replacement_vehicle
        data:
          station_id: 123
          original_vehicle_number: "04-2333"
          vehicle_number: "{{ voertuignummer | trim }}"

  brandweer_post_a_vervangend_voertuig_opheffen:
    alias: Brandweer Post A - Vervangend voertuig opheffen
    icon: mdi:truck-remove
    mode: single
    sequence:
      - action: fireservicerota.clear_replacement_vehicle
        data:
          station_id: 123
          original_vehicle_number: "04-2333"

  brandweer_post_a_vervangend_voertuig_opvragen:
    alias: Brandweer Post A - Vervangend voertuig opvragen
    mode: single
    sequence:
      - action: fireservicerota.get_replacement_vehicles
        response_variable: replacement_result
      - action: logbook.log
        data:
          name: FireServiceRota
          message: "{{ replacement_result.active | default([]) | to_json }}"
