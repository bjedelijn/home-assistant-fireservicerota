# Home Assistant package example: temporary replacement vehicle per station.
# This is a local display/announcement override, NOT a change to
# BrandweerRooster, the P2000 source, or official vehicle registration.
# Replace placeholder vehicle and station values with your own.
input_text:
  brandweer_post_a_vervangend_voertuig:
    name: Brandweer Post A vervangend voertuig
    max: 16
    icon: mdi:fire-truck

script:
  brandweer_post_a_vervangend_voertuig_instellen:
    alias: Brandweer Post A - Vervangend voertuig instellen
    fields:
      voertuignummer:
        required: true
        selector:
          text: {}
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.brandweer_post_a_vervangend_voertuig
        data:
          value: "{{ voertuignummer | trim }}"
  brandweer_post_a_vervangend_voertuig_opheffen:
    alias: Brandweer Post A - Vervangend voertuig opheffen
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.brandweer_post_a_vervangend_voertuig
        data:
          value: ""

template:
  - sensor:
      - name: Brandweer Post A actueel voertuig
        unique_id: brandweer_post_a_actueel_voertuig
        icon: mdi:fire-truck
        state: >-
          {% set vervanging = states('input_text.brandweer_post_a_vervangend_voertuig') %}
          {{ vervanging if vervanging not in ['unknown','unavailable','none',''] else '04-0000' }}
        attributes:
          standaard_voertuig: "04-0000"
          vervangend_voertuig: >-
            {% set s = states('input_text.brandweer_post_a_vervangend_voertuig') %}
            {{ s if s not in ['unknown','unavailable','none',''] else '' }}
          vervanging_actief: >-
            {{ states('input_text.brandweer_post_a_vervangend_voertuig') not in
              ['unknown','unavailable','none',''] }}
