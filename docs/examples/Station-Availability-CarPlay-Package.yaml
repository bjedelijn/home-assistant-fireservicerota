# Example package: verified station availability for dashboard / Siri / CarPlay
# Replace placeholder station_id / station_name / wrapper scripts for your installation.

input_text:
  brandweer_paraat_laatste_resultaat:
    name: Brandweer paraat laatste resultaat
    max: 255
    icon: mdi:account-check-outline

script:
  brandweer_paraat_wijzig:
    alias: Brandweer - Paraatstatus wijzigen en controleren
    icon: mdi:account-sync
    mode: queued
    max: 10
    fields:
      station_id:
        required: true
      station_name:
        required: true
      available:
        required: true
      availability_mode:
        required: true
    sequence:
      - action: fireservicerota.set_station_availability
        data:
          station_id: "{{ station_id | int }}"
          available: "{{ available | bool }}"
          mode: "{{ availability_mode }}"
          comments: "Home Assistant · CarPlay/dashboard"
        response_variable: fsr_result

      - variables:
          bevestigd: "{{ fsr_result.confirmed | default(false) | bool }}"
          gewijzigd: "{{ fsr_result.status_changed | default(false) | bool }}"
          actueel: "{{ fsr_result.actual_available | default(none) }}"
          eind_raw: "{{ fsr_result.end_time | default('') }}"
          eind_tekst: >-
            {% if eind_raw %}
              {{ as_datetime(eind_raw).astimezone().strftime('%H:%M') }}
            {% else %}
              onbekende tijd
            {% endif %}
          gewenst_tekst: "{{ 'paraat' if (available | bool) else 'niet paraat' }}"
          actueel_tekst: >-
            {% if actueel is sameas true %}paraat
            {% elif actueel is sameas false %}niet paraat
            {% else %}onbekend
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ bevestigd and gewijzigd }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.brandweer_paraat_laatste_resultaat
                data:
                  value: >-
                    {{ station_name }} is nu {{ gewenst_tekst }} tot {{ eind_tekst }}.

          - conditions:
              - condition: template
                value_template: "{{ bevestigd and not gewijzigd }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.brandweer_paraat_laatste_resultaat
                data:
                  value: >-
                    {{ station_name }} stond al {{ gewenst_tekst }}.
                    De periode is bevestigd tot {{ eind_tekst }}.

        default:
          - action: input_text.set_value
            target:
              entity_id: input_text.brandweer_paraat_laatste_resultaat
            data:
              value: >-
                Wijziging niet bevestigd. {{ station_name }} staat volgens BrandweerRooster nu {{ actueel_tekst }}.

  # Example wrappers for one post. Duplicate for additional posts and replace station_id.
  brandweer_post_a_paraat:
    alias: Brandweer Post A - Paraat tot roosterwijziging
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: true
          availability_mode: next_schedule_change

  brandweer_post_a_niet_paraat:
    alias: Brandweer Post A - Niet paraat tot roosterwijziging
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: false
          availability_mode: next_schedule_change

  brandweer_post_a_paraat_1u:
    alias: Brandweer Post A - Paraat 1 uur
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: true
          availability_mode: 1h

  brandweer_post_a_niet_paraat_1u:
    alias: Brandweer Post A - Niet paraat 1 uur
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: false
          availability_mode: 1h

  brandweer_post_a_paraat_2u:
    alias: Brandweer Post A - Paraat 2 uur
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: true
          availability_mode: 2h

  brandweer_post_a_niet_paraat_2u:
    alias: Brandweer Post A - Niet paraat 2 uur
    sequence:
      - action: script.brandweer_paraat_wijzig
        data:
          station_id: 123
          station_name: Post A
          available: false
          availability_mode: 2h
